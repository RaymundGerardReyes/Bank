services:
  # In production, we ONLY expose the Nginx gateway ports.
  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"

  backend:
    environment:
      APP_ENV: production
      # CRITICAL: PAYMENT_CHECKOUT_BASE_URL must resolve to the external payment gateway host
      # (e.g., https://${PAYMENT_WEBHOOK_HOST}) matching Nginx virtual host routing for /checkout/.
      PAYMENT_CHECKOUT_BASE_URL: ${PAYMENT_CHECKOUT_BASE_URL:-https://${PAYMENT_WEBHOOK_HOST}}

    # No exposed ports; accessed purely via Nginx
    # No source bind mounts; the container runs the compiled bytecode

  web-app:
    environment:
      NODE_ENV: production
    # No exposed ports; accessed purely via Nginx

  database:
    # No exposed ports; the database is completely isolated on the internal app-net
    ports: []
