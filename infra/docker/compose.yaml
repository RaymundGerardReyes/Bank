services:

  # ==========================================================
  # NGINX (Gateway)
  # ==========================================================
  nginx:
    image: nginx:alpine
    container_name: banking_gateway
    restart: unless-stopped
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      - UI_PUBLIC_HOST=${UI_PUBLIC_HOST}
      - API_PUBLIC_HOST=${API_PUBLIC_HOST}
      - PAYMENT_WEBHOOK_HOST=${PAYMENT_WEBHOOK_HOST}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN}
      - BACKEND_UPSTREAM_HOST=backend
      - BACKEND_UPSTREAM_PORT=8080
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    ports:
      - "${NGINX_HTTP_PORT:?NGINX_HTTP_PORT must be defined}:80"
    depends_on:
      backend:
        condition: service_healthy
      web-app:
        condition: service_started
    networks:
      frontend-net:
        aliases:
          - soc-nginx-proxy
      api-net: {}

  # ==========================================================
  # CLOUDFLARE ZERO TRUST TUNNEL
  # ==========================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: banking_cloudflared_edge
    restart: unless-stopped
    networks:
      - frontend-net
    user: "65532:65532"
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TUNNEL_EDGE_BIND_ADDRESS=0.0.0.0
      - TUNNEL_TRANSPORT_PROTOCOL=quic
    depends_on:
      nginx:
        condition: service_started
    command: tunnel --no-autoupdate --retries 5 --grace-period 15s run

  # ==========================================================
  # BACKEND (Java Spring Boot)
  # ==========================================================
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: banking_backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      PAYMENT_WEBHOOK_PUBLIC_URL: ${PAYMENT_WEBHOOK_PUBLIC_URL}
      PAYMENT_WEBHOOK_HOST: ${PAYMENT_WEBHOOK_HOST}
      PAYMENT_ALLOWED_DOMAINS: ${PAYMENT_ALLOWED_DOMAINS}
      # Docker Compose acts as the container-runtime boundary override.
      # While native bootRun uses DB_HOST=localhost (via .env), the containerized
      # application MUST use the Docker-internal topology invariant.
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      FRONTEND_PUBLIC_ORIGIN: ${FRONTEND_PUBLIC_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME}
      PASSKEY_RP_ORIGIN: ${PASSKEY_RP_ORIGIN}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # Pinging the Spring Boot Actuator health endpoint (Forced IPv4)
      test: [ "CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - api-net
      - database-net

  # ==========================================================
  # FRONTEND (Next.js)
  # ==========================================================
  web-app:
    build:
      context: ../../web-app
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL
        - NEXT_PUBLIC_PLATFORM_DOMAIN
        - NEXT_PUBLIC_WEBAUTHN_RP_ID
    container_name: banking_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: ${APP_ENV:-production}
      BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL}
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      OPENAPI_SPEC_URL: ${OPENAPI_SPEC_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ENABLE_PASSKEY_AUTH: ${ENABLE_PASSKEY_AUTH}
      ENABLE_DEV_API_DOCS: ${ENABLE_DEV_API_DOCS}
      INTERNAL_BFF_API_KEY: ${INTERNAL_BFF_API_KEY}
      NEXT_PUBLIC_WEBAUTHN_RP_ID: ${NEXT_PUBLIC_WEBAUTHN_RP_ID}
    networks:
      - frontend-net
      - api-net

  # ==========================================================
  # DATABASE (PostgreSQL)
  # ==========================================================
  database:
    image: postgres:17-alpine
    container_name: banking_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5435:5432"
    networks:
      - database-net

networks:
  frontend-net:
    driver: bridge
  api-net:
    driver: bridge
  database-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
