services:

  # ==========================================================
  # NGINX (Gateway)
  # ==========================================================
  nginx:
    image: nginx:alpine
    container_name: banking_gateway
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      web-app:
        condition: service_started
    networks:
      - app-net

  # ==========================================================
  # BACKEND (Java Spring Boot)
  # ==========================================================
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: banking_backend
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8082:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-banking}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME}
      PASSKEY_RP_ORIGIN: ${PASSKEY_RP_ORIGIN}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # Pinging the Spring Boot Actuator health endpoint (Forced IPv4)
      test: [ "CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-net

  # ==========================================================
  # FRONTEND (Next.js)
  # ==========================================================
  web-app:
    build:
      context: ../../web-app
      dockerfile: Dockerfile
      args:
        - BACKEND_API_BASE_URL
        - NEXT_PUBLIC_APP_URL
        - OPENAPI_SPEC_URL
        - SESSION_SECRET
        - ENABLE_PASSKEY_AUTH
        - ENABLE_DEV_API_DOCS
    container_name: banking_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: ${APP_ENV:-production}
      BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      OPENAPI_SPEC_URL: ${OPENAPI_SPEC_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ENABLE_PASSKEY_AUTH: ${ENABLE_PASSKEY_AUTH}
      ENABLE_DEV_API_DOCS: ${ENABLE_DEV_API_DOCS}
    networks:
      - app-net

  # ==========================================================
  # DATABASE (PostgreSQL)
  # ==========================================================
  database:
    image: postgres:17-alpine
    container_name: banking_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banking}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-banking}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
