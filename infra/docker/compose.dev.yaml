services:
  # In development, we expose ports to the host for local debugging and DB access.
  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"

  backend:
    environment:
      APP_ENV: development
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: database
      DB_PORT: 5432
    # Locally, we can bind-mount the src directory if using hot-reload tools like Devtools
    volumes:
      - ../../backend/src:/app/src

  # ==========================================================
  # FRONTEND (Next.js)
  # ==========================================================
  web-app:
    environment:
      NODE_ENV: development
      # Explicitly force the port so it never tries to read an encrypted string
      PORT: 3000
    # Bypass the missing dotenvx container dependency and run Next.js natively
    command: sh -c "node scripts/clean.mjs && npx next dev -p 3000 -H 0.0.0.0"
    volumes:
      # Mount the entire web-app directory for hot-reloading
      - ../../web-app:/app
      # Exclude node_modules to avoid cross-OS compilation issues
      - /app/node_modules
      # Exclude .next directory to avoid Windows vs Linux permission conflicts in Turbopack
      - /app/.next
    ports:
      - "127.0.0.1:${WEB_APP_DEBUG_PORT:-3001}:3000"
