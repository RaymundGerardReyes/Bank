worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ──────────────────────────────────────────────────
  # Gzip Compression
  # ──────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1000;

  # ──────────────────────────────────────────────────
  # OWASP ASVS V1 — Rate Limiting Zones
  # Prevents DDoS and brute-force attacks
  # ──────────────────────────────────────────────────
  # General API: 20 requests/sec per IP, burst of 40
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  
  # Auth endpoints: 5 requests/sec per IP (brute-force protection)
  limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/s;
  
  # Strict Auth endpoints (e.g. password resets): 1 request/sec per IP
  limit_req_zone $binary_remote_addr zone=api_auth_strict:10m rate=1r/s;

  # ──────────────────────────────────────────────────
  # OWASP ASVS V1 — Security Headers (Transport Layer)
  # ──────────────────────────────────────────────────
  add_header X-Frame-Options           "SAMEORIGIN"            always;
  add_header X-Content-Type-Options    "nosniff"               always;
  add_header Referrer-Policy           "strict-origin"         always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://accounts.google.com https://static.cloudflareinsights.com https://cdn.jsdelivr.net; frame-src 'self' https://challenges.cloudflare.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://cdn.jsdelivr.net; img-src 'self' data: https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss: ws: https://accounts.google.com https://banking.internal http://banking.internal; frame-ancestors 'self';" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Hide server identification
  server_tokens off;

  # Limit request body size
  client_max_body_size 10m;

  # ──────────────────────────────────────────────────
  # Cloudflare Real IP Handling
  # ──────────────────────────────────────────────────
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # Cloudflare IPv4 ranges (Official)
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;

  # Cloudflare IPv6 ranges (Official)
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;

  # ──────────────────────────────────────────────────
  # Cloudflare-specific Observability Logging
  # ──────────────────────────────────────────────────
  log_format structured
    'client_ip=$remote_addr '
    'cf_ip=$http_cf_connecting_ip '
    'xff="$http_x_forwarded_for" '
    'request="$request" '
    'status=$status '
    'request_time=$request_time '
    'upstream_status=$upstream_status '
    'upstream_response_time=$upstream_response_time '
    'correlation_id="$http_x_correlation_id" '
    'cf_ray="$http_cf_ray"';

  access_log /var/log/nginx/access.log structured;
  error_log  /var/log/nginx/error.log  warn;

  # ──────────────────────────────────────────────────
  # Docker Upstreams (Resilient)
  # ──────────────────────────────────────────────────
  upstream springboot {
    server backend:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream nextjs {
    server web-app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # ──────────────────────────────────────────────────
  # WebSocket Connection Upgrade Map
  # ──────────────────────────────────────────────────
  map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
  }

  server {
    listen 80;
    listen [::]:80 ipv6only=on;
    server_name _;

    # Global proxy timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ──────────────────────────────────────────────
    # Auth endpoints — strict rate limit (brute-force)
    # ──────────────────────────────────────────────
    location /api/v1/auth/reset/ {
      limit_req zone=api_auth_strict burst=2 nodelay;
      limit_req_status 429;

      proxy_pass         http://springboot;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
    }

    location /api/v1/auth/ {
      limit_req zone=api_auth burst=10 nodelay;
      limit_req_status 429;

      proxy_pass         http://springboot;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
    }

    # ──────────────────────────────────────────────
    # General API — standard rate limit
    # ──────────────────────────────────────────────
    location /api/v1/ {
      limit_req zone=api_general burst=40 nodelay;
      limit_req_status 429;

      proxy_pass         http://springboot;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
    }

    # ──────────────────────────────────────────────
    # SignalR / WebSocket hubs
    # ──────────────────────────────────────────────
    location /hubs/ {
      proxy_pass         http://springboot;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # ──────────────────────────────────────────────
    # OpenAPI Documentation
    # ──────────────────────────────────────────────
    location /v3/api-docs {
      proxy_pass         http://springboot;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ──────────────────────────────────────────────
    # Health checks
    # ──────────────────────────────────────────────
    location /health/live {
      proxy_pass http://springboot/actuator/health/liveness;
      proxy_set_header Host $host;
    }

    location /health/ready {
      proxy_pass http://springboot/actuator/health/readiness;
      proxy_set_header Host $host;
    }

    # ──────────────────────────────────────────────
    # Frontend Next.js Web App
    # ──────────────────────────────────────────────
    location / {
      proxy_pass         http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      
      # For Next.js Hot Module Replacement (HMR) if used behind Nginx
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
    }
  }
}
