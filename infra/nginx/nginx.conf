worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ──────────────────────────────────────────────────
  # Gzip Compression
  # ──────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1000;

  # ──────────────────────────────────────────────────
  # OWASP ASVS V1 — Rate Limiting Zones
  # ──────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/s;
  limit_req_zone $binary_remote_addr zone=api_auth_strict:10m rate=1r/s;

  # ──────────────────────────────────────────────────
  # OWASP ASVS V1 — Security Headers
  # ──────────────────────────────────────────────────
  add_header X-Frame-Options           "SAMEORIGIN"            always;
  add_header X-Content-Type-Options    "nosniff"               always;
  add_header Referrer-Policy           "strict-origin"         always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://accounts.google.com https://static.cloudflareinsights.com https://cdn.jsdelivr.net; frame-src 'self' blob: data: https://challenges.cloudflare.com https://accounts.google.com; worker-src 'self' blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://cdn.jsdelivr.net; img-src 'self' data: https: http: https://accounts.google.com; font-src 'self' data: https: http: https://fonts.gstatic.com https://fonts.scalar.com; connect-src 'self' wss: ws: https://${UI_PUBLIC_HOST} http://${UI_PUBLIC_HOST} https://accounts.google.com https://banking.internal http://banking.internal https: http: *; frame-ancestors 'self';" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

  server_tokens off;
  client_max_body_size 10m;

  # ──────────────────────────────────────────────────
  # Cloudflare Real IP Handling
  # ──────────────────────────────────────────────────
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;

  # ADDED: Trust local Docker networks (cloudflared container)
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;

  log_format structured
    'client_ip=$remote_addr '
    'cf_ip=$http_cf_connecting_ip '
    'xff="$http_x_forwarded_for" '
    'request_id="$request_id" '
    'request="$request" '
    'status=$status '
    'request_time=$request_time '
    'upstream_addr="$upstream_addr" '
    'upstream_status=$upstream_status '
    'upstream_response_time=$upstream_response_time '
    'correlation_id="$http_x_correlation_id" '
    'cf_ray="$http_cf_ray"';

  access_log /var/log/nginx/access.log structured;
  error_log  /var/log/nginx/error.log  warn;

  # ──────────────────────────────────────────────────
  # Docker Upstreams
  # ──────────────────────────────────────────────────
  upstream springboot {
    server ${BACKEND_UPSTREAM_HOST}:${BACKEND_UPSTREAM_PORT} max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream nextjs {
    server web-app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
  }

  map $http_x_forwarded_proto $real_scheme {
      default $http_x_forwarded_proto;
      ''      $scheme;
  }

  # ──────────────────────────────────────────────────
  # 1. Catch-all Default Server
  # ──────────────────────────────────────────────────
  server {
    listen 80 default_server;
    listen [::]:80 default_server ipv6only=on;
    server_name _;
    
    # Return 404 instead of 421 or 444 to avoid ERR_INVALID_RESPONSE in browsers.
    # This explicitly tells us that Nginx blocked the request due to an unrecognized Host header.
    return 404 "Nginx Gateway: Host header mismatch. Please verify that your .env domains match the requested URL.";
  }

  # ──────────────────────────────────────────────────
  # 2. UI Virtual Host (Frontend)
  # ──────────────────────────────────────────────────
  server {
    listen 80;
    listen [::]:80;
    
    # We keep localhost/127.0.0.1 for local development testing
    server_name ${UI_PUBLIC_HOST} localhost 127.0.0.1;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Route OpenAPI Docs directly to the backend to avoid Next.js 404
    location /v3/api-docs/ {
      proxy_pass         http://springboot;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Request-Id      $request_id;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $real_scheme;
    }

    # Route external API calls made from the Developer Portal directly to the backend.
    # This ensures Scalar's native try-it-out features work without CORS errors.
    location /api/v1/ {
      proxy_pass         http://springboot;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Request-Id      $request_id;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $real_scheme;
    }

    # Route all traffic here to Next.js
    location / {
      proxy_pass         http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Request-Id      $request_id;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $real_scheme;
      
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;

      # Strip any upstream X-Frame-Options headers so Nginx's SAMEORIGIN directive
      # (set globally above) is the single authoritative source.
      proxy_hide_header  X-Frame-Options;
      proxy_hide_header  Content-Security-Policy;
    }
  }

  # ──────────────────────────────────────────────────
  # 3. API Virtual Host (General Backend)
  # ──────────────────────────────────────────────────
  server {
    listen 80;
    listen [::]:80;
    server_name ${API_PUBLIC_HOST};

    # Allow general API routes
    location /api/v1/ {
      proxy_pass         http://springboot;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Request-Id      $request_id;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $real_scheme;
    }

    # Block everything else on the API domain
    location / {
      return 404;
    }
  }

  # ──────────────────────────────────────────────────
  # 4. Webhook Virtual Host (Payment Providers)
  # ──────────────────────────────────────────────────
  server {
    listen 80;
    listen [::]:80;
    server_name ${PAYMENT_WEBHOOK_HOST};

    # EXACT MATCH: Only allow the specific PayMongo webhook route
    location = /api/v1/webhooks/payment/paymongo {
      limit_req zone=api_general burst=20 nodelay;
      limit_req_status 429;

      proxy_pass         http://springboot;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Request-Id      $request_id;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $real_scheme;
      proxy_set_header   Connection        "";
    }

    # ALLOW: Route isolated checkout UI to the Next.js frontend
    location ^~ /checkout/ {
      proxy_pass         http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Request-Id      $request_id;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $real_scheme;
    }

    # ALLOW: Next.js static assets required for the checkout UI
    location ^~ /_next/ {
      proxy_pass         http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
    }

    # Block everything else on the webhook domain
    location / {
      return 404;
    }
  }
}
