# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...|optional_commit_body
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED COMPONENT RELEASE
# Each component is isolated by scope and tagged with its semver release.
# ------------------------------------------------------------------------------

backend|backend|feat|expose live FX rate telemetry, provider attribution, and on-demand cache refresh|backend|Add provider telemetry fields (provider, providerAttribution, isLive, timeLastUpdateUtc, timeNextUpdateUtc, disclaimer) and refresh parameter to FxController and LiveExchangeRateProviderAdapter, enrich ExchangeRateApiResponse with upstream UTC timestamps, and add FxRatePathIT test assertions.
web-app|web-app|feat|add live FX valuation proof modal, real-time rate telemetry, and on-demand sync|web-app|Add Foreign Exchange Valuation Proof modal demonstrating native sub-account physical asset conservation and step-by-step mathematical liquidity computation, render real-time FX rate badge with live pulse indicator, add on-demand rate sync button, and enrich fxService with provider telemetry.
mobile|mobile|feat|add provider telemetry attributes and on-demand refresh to mobile FX service|ExpoBankingApp|Update mobile fxService with provider telemetry metadata fields and refresh parameter.
tooling|tooling|chore|update module release configurations for live FX telemetry and valuation audit|isolated_release.sh,modules.conf,scripts,.gitignore,.dockerignore|Update modules.conf release configurations.

# ------------------------------------------------------------------------------
# APPROACH 1: INDEPENDENT COMPONENT RELEASES (Microservices style)
# If you deploy components separately, uncomment the lines below as needed.
# ------------------------------------------------------------------------------
# backend|backend|feat|integrate QR Ph checkout flow, add FX rate conversion, and execute Flyway schema migrations|backend
# web-app|web-app|feat|add QR Ph payment option, dynamic QR presentation view, and FX conversion services|web-app
# mobile|mobile|feat|integrate foreign exchange conversion services and update account balances display|ExpoBankingApp
# tests|tests|test|add OpenAPI endpoint verification suite and expand Postman test collections|tests
# tooling|tooling|chore|update release script configurations and module release definitions|isolated_release.sh,modules.conf,scripts,.gitignore,.dockerignore
# backend|backend|fix|resolve gateway checkout URL, fix clearing account FK constraint, and whitelist public sessions|backend
# infra|infra|chore|configure payment gateway checkout URL and platform domain routing|infra
# web-app|web-app|fix|render QR Ph on HTML5 canvas, embed vector logo, and resolve premature timer expiration|web-app
# tooling|tooling|chore|update release configuration for gateway bug fixes and QR canvas update|isolated_release.sh,modules.conf,scripts,.gitignore,.dockerignore
