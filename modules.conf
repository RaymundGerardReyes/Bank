# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...|optional_commit_body
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED COMPONENT RELEASE
# Each component is isolated by scope and tagged with its semver release.
# ------------------------------------------------------------------------------

backend|backend|fix|deduplicate platform domain derivation, eliminate hardcoded domains, and enforce zero-trust CORS and payment invariants|backend|Deduplicate platform root domain derivation across CorsConfig, OpenApiConfig, and PaymentIntentOrchestrationService, eliminate all hardcoded dummy domain strings in favor of dynamic ${PLATFORM_DOMAIN} resolution with localhost fallback, enhance payment domain validation with wildcards, and add DomainContractE2EIT integration tests.
infra|infra|chore|standardize centralized platform domain routing and establish fallback defaults across Docker and Nginx|infra|Normalize platform domain routing across compose.yaml, compose.production.yaml, and nginx.conf, eliminate hardcoded domain values, provide resilient defaults for OPENAPI_SPEC_URL, ENABLE_DEV_API_DOCS, and ENABLE_PASSKEY_AUTH, and align virtual host ingress with DRY PLATFORM_DOMAIN contracts.
web-app|web-app|fix|resolve developer portal 404 routing, eliminate hardcoded domains, and integrate unified cross-navigation|web-app|Resolve 404 page routing in middleware for developer docs by defaulting ENABLE_DEV_API_DOCS to true, eliminate hardcoded domain strings across client and server environments via dynamic getRootDomain and getApiBaseUrl helpers in domains.ts, add DeveloperNavTabs across developer sub-routes, and ensure resilient OpenAPI spec fallback in ApiReferenceViewer and env.ts.
tests|tests|test|add end-to-end domain refactoring test suites and verification scripts|tests|Add run-e2e-domain-suite.mjs and e2e-domain-refactoring verification suite to test zero-trust domain derivation, developer portal routes, and payment webhook invariants.
tooling|tooling|chore|update release module configuration for domain deduplication and developer portal fixes|isolated_release.sh,modules.conf,scripts,.gitignore,.dockerignore|Update modules.conf release configurations with entries for backend domain deduplication, infra docker/nginx routing, web-app developer portal 404 fix, and domain e2e test suite.

