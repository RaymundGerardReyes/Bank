# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...|optional_commit_body
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED COMPONENT RELEASE
# Each component is isolated by scope and tagged with its semver release.
# ------------------------------------------------------------------------------

backend|backend|refactor|harden gateway security filters, enforce customer key mapping, and implement ISO-8601 UTC scheduled transfers|backend|Enforce RFC Authorization Bearer header precedence over X-API-Key, excise autoAdoptApiKey backdoor preventing unauthorized dummy account bindings, persist customer_id and merchant_id relationships on ApiKey and Account domains, add Flyway V65 backfill migration, harden PaymentGatewayController with zero-trust account boundary checks, introduce Flyway V66 adding scheduled_execution_at to transactions, serialize createdAt and scheduledExecutionAt as Instant UTC with trailing Z, enforce strict domain Money currency isolation, and add account consistency integration tests.
web-app|web-app|feat|enhance checkout session terminal states, segregate multi-currency liquidity, and support UTC scheduled transfers|web-app|Add PublicCheckoutSession models and typed service methods, enhance TerminalStateScreen with auto-redirect countdown, pause/resume controls, and merchant return navigation, add dedicated cancel and success checkout routes, segregate account dashboard balances by currency into Liquidity by Currency portfolio to eliminate illegal cross-currency scalar sums, format transactions with localized timezones and Scheduled indicators, and add unit tests for terminal screens and formatters.
mobile|mobile|refactor|segregate multi-currency liquidity and support scheduled transfer formatting|ExpoBankingApp|Replace cross-currency scalar balance sums with currency-segregated Liquidity by Currency portfolios across dashboard and account list screens, update Transaction model and list items to display scheduled execution dates with Scheduled badges, and upgrade date formatters with localized timezone support.
infra|infra|chore|update Docker compose and container orchestration settings|infra|Configure Docker dev services and container dependencies to support seamless local development.
tests|tests|test|expand gateway payment intent suite and resolve Postman test collections|tests|Add standalone 5/5 passing gateway payment intent collection, automated Node.js test runner, and align assertions across account management and external payment suites.
tooling|tooling|chore|update release script configuration and module release definitions|isolated_release.sh,modules.conf,scripts,.gitignore,.dockerignore|Add stale index.lock self-healing to isolated_release.sh, align modules.conf with gateway security, multi-currency portfolio, and timezone UTC release scopes, and update root ignore rules.

