# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...|optional_commit_body
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED COMPONENT RELEASE
# Each component is isolated by scope and tagged with its semver release.
# ------------------------------------------------------------------------------

backend|backend|feat|implement dynamic API key auto-adoption, external transfers, and intent approvals|backend|Implement self-healing dynamic API key auto-adoption for payment gateway, add external transfer orchestration endpoint, expose push transaction authorization approval routes, add Flyway V64 seed migration, and enforce empty account settings validation.
web-app|web-app|feat|enhance BFF gateway proxy header forwarding and harden webhook UI|web-app|Forward x-api-key, x-client-id, and x-linked-account headers through proxy routes, add defensive null-safe rendering in WebhookManager, and refine API management dashboard components.
infra|infra|chore|update Docker compose and container orchestration settings|infra|Configure Docker dev services and container dependencies to support seamless local development.
tests|tests|test|expand gateway payment intent suite and resolve Postman test collections|tests|Add standalone 5/5 passing gateway payment intent collection, automated Node.js test runner, and align assertions across account management and external payment suites.
tooling|tooling|chore|update release script configuration and module release definitions|isolated_release.sh,modules.conf,scripts|Synchronize modules.conf and isolated_release.sh with gateway auto-adoption, BFF proxy forwarding, and Postman test suite scopes.

