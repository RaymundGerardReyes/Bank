# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED MONOLITHIC RELEASE (Lockstep Versioning)
# Recommended for SOLO DEVELOPERS for maximum ease of tracking. 
# A single version tag represents the entire state of the full-stack repo.
# ------------------------------------------------------------------------------

backend|backend|fix|stabilize production connectivity, security filters, and external payment tests|backend
web-app|web-app|fix|resolve environment configuration and optimize API management UI|web-app
infra|infra|chore|harden Docker environment configurations and NGINX routing|infra
docs|docs|docs|update architectural documentation and prompt extensions|structure.md,banking-backend-hardened-architecture.md,money-movement-feature-extension-prompt.md,CHANGELOG.md
tooling|tooling|chore|update environment validation scripts and root configurations|.gitignore,package.json,scripts,check-env.js,isolated_release.sh,modules.conf
# ------------------------------------------------------------------------------
# APPROACH 1: INDEPENDENT COMPONENT RELEASES (Microservices style)
# If you eventually scale up to a team and need to deploy components separately,
# comment out Approach 2 above and uncomment the lines below.
# ------------------------------------------------------------------------------

# backend|backend|fix|stabilize production connectivity, security filters, and external payment tests|backend
# web-app|web-app|fix|resolve environment configuration and optimize API management UI|web-app
# infra|infra|chore|harden Docker environment configurations and NGINX routing|infra
# docs|docs|docs|update architectural documentation and prompt extensions|structure.md,banking-backend-hardened-architecture.md,money-movement-feature-extension-prompt.md,CHANGELOG.md
# tooling|tooling|chore|update environment validation scripts and root configurations|.gitignore,package.json,scripts,check-env.js,isolated_release.sh,modules.conf

