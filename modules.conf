# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED MONOLITHIC RELEASE (Lockstep Versioning)
# Recommended for SOLO DEVELOPERS for maximum ease of tracking. 
# A single version tag represents the entire state of the full-stack repo.
# ------------------------------------------------------------------------------

backend|backend|feat!|architect financial core freeze, implement outbox pattern, checkout sessions, and settlement orchestration|backend/build.gradle,backend/src
web-app|web-app|refactor!|restructure frontend architecture, migrate routing to (portals)/(public) and components to features/ui|web-app
infra|infra|chore|update docker compose configuration and remove overrides|infra
tooling|tooling|chore|update release configuration and root scripts to align with monolithic repo refactoring|.port-audit.json,api-gateway-hardening-prompt.md,backendstructure.md,package.json,structure.md,fix_flattened_files.js,migrate_test_directories.js,remove_dirties_context.js,revert_directories.js,modules.conf,isolated_release.sh

# ------------------------------------------------------------------------------
# APPROACH 1: INDEPENDENT COMPONENT RELEASES (Microservices style)
# If you eventually scale up to a team and need to deploy components separately,
# comment out Approach 2 above and uncomment the lines below.
# ------------------------------------------------------------------------------

# backend|backend|feat!|architect financial core freeze, implement outbox pattern, checkout sessions, and settlement orchestration|backend/build.gradle,backend/src
# web-app|web-app|refactor!|restructure frontend architecture, migrate routing to (portals)/(public) and components to features/ui|web-app
# infra|infra|chore|update infrastructure configurations|infra
# tooling|tooling|chore|update scripts and configs|.port-audit.json,api-gateway-hardening-prompt.md,backendstructure.md,package.json,structure.md,fix_flattened_files.js,migrate_test_directories.js,remove_dirties_context.js,revert_directories.js,modules.conf,isolated_release.sh
# mobile|expo|feat|Update mobile app|ExpoBankingApp
# docs|docs|docs|Update architecture and documentation|docs,*.md
