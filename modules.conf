# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED MONOLITHIC RELEASE (Lockstep Versioning)
# Recommended for SOLO DEVELOPERS for maximum ease of tracking. 
# A single version tag represents the entire state of the full-stack repo.
# ------------------------------------------------------------------------------

backend|backend|feat|implement Frankfurter FX integration, resolve webhook verifications, and harden transfer architecture|backend
web-app|web-app|feat|enhance transfer forms with FX handling and stabilize e2e security workflows|web-app
infra|infra|chore|update NGINX gateway routing for transactional boundaries|infra
tests|tests|test|align security matrix and postman collections with Phase 3 financial hardening|tests
docs|docs|docs|update architectural docs for Phase 3 FX and gateway hardening|structure.md,backendstructure.md,api-gateway-hardening-prompt.md,architecture_review.md
tooling|tooling|chore|update root dependencies and release configurations|package.json,package-lock.json,isolated_release.sh,modules.conf
# ------------------------------------------------------------------------------
# APPROACH 1: INDEPENDENT COMPONENT RELEASES (Microservices style)
# If you eventually scale up to a team and need to deploy components separately,
# comment out Approach 2 above and uncomment the lines below.
# ------------------------------------------------------------------------------

# backend|backend|feat|implement Frankfurter FX integration, resolve webhook verifications, and harden transfer architecture|backend
# web-app|web-app|feat|enhance transfer forms with FX handling and stabilize e2e security workflows|web-app
# infra|infra|chore|update NGINX gateway routing for transactional boundaries|infra
# tests|tests|test|align security matrix and postman collections with Phase 3 financial hardening|tests
# docs|docs|docs|update architectural docs for Phase 3 FX and gateway hardening|structure.md,backendstructure.md,api-gateway-hardening-prompt.md,architecture_review.md
# tooling|tooling|chore|update root dependencies and release configurations|package.json,package-lock.json,isolated_release.sh,modules.conf

