# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED MONOLITHIC RELEASE (Lockstep Versioning)
# Recommended for SOLO DEVELOPERS for maximum ease of tracking. 
# A single version tag represents the entire state of the full-stack repo.
# ------------------------------------------------------------------------------

backend|backend|feat|implement dynamic QR payments, merchant developer onboarding, and API gateway security|backend
web-app|web-app|feat|add QR payment creation, API key management UI, and external checkout pages|web-app
infra|infra|chore|update Docker compose and NGINX config for payment gateway routing|infra
docs|docs|docs|update project structure and API gateway implementation plans|structure.md,api-gateway-hardening-prompt.md,implementation_plan.md
tooling|tooling|chore|update release script example and configuration for current architecture|isolated_release.sh,modules.conf

# ------------------------------------------------------------------------------
# APPROACH 1: INDEPENDENT COMPONENT RELEASES (Microservices style)
# If you eventually scale up to a team and need to deploy components separately,
# comment out Approach 2 above and uncomment the lines below.
# ------------------------------------------------------------------------------

# backend|backend|feat|implement dynamic QR payments, merchant developer onboarding, and API gateway security|backend
# web-app|web-app|feat|add QR payment creation, API key management UI, and external checkout pages|web-app
# infra|infra|chore|update Docker compose and NGINX config for payment gateway routing|infra
# docs|docs|docs|update project structure and API gateway implementation plans|structure.md,api-gateway-hardening-prompt.md,implementation_plan.md
# tooling|tooling|chore|update release script example and configuration for current architecture|isolated_release.sh,modules.conf

