# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED MONOLITHIC RELEASE (Lockstep Versioning)
# Recommended for SOLO DEVELOPERS for maximum ease of tracking. 
# A single version tag represents the entire state of the full-stack repo.
# ------------------------------------------------------------------------------

backend|backend|feat|harden payment gateway authorization, implement dynamic host allowlist, and resolve idempotency violations|backend
web-app|web-app|feat|enhance external payment UI and update gateway proxy routing|web-app
mobile|mobile|fix|update transfer form and error banner components|ExpoBankingApp
infra|infra|chore|update NGINX routing for payment gateway strict enforcement|infra
tests|tests|test|expand security matrix for payment gateway validation and payload integrity|tests
docs|docs|docs|update architecture docs for payment gateway hardening and idempotency claims|structure.md,banking-backend-hardened-architecture.md,JavaBankingstructure.md
tooling|tooling|chore|update root dependencies and release configurations|package.json,package-lock.json,isolated_release.sh,modules.conf
# ------------------------------------------------------------------------------
# APPROACH 1: INDEPENDENT COMPONENT RELEASES (Microservices style)
# If you eventually scale up to a team and need to deploy components separately,
# comment out Approach 2 above and uncomment the lines below.
# ------------------------------------------------------------------------------

# backend|backend|feat|harden payment gateway authorization, implement dynamic host allowlist, and resolve idempotency violations|backend
# web-app|web-app|feat|enhance external payment UI and update gateway proxy routing|web-app
# mobile|mobile|fix|update transfer form and error banner components|ExpoBankingApp
# infra|infra|chore|update NGINX routing for payment gateway strict enforcement|infra
# tests|tests|test|expand security matrix for payment gateway validation and payload integrity|tests
# docs|docs|docs|update architecture docs for payment gateway hardening and idempotency claims|structure.md,banking-backend-hardened-architecture.md,JavaBankingstructure.md
# tooling|tooling|chore|update root dependencies and release configurations|package.json,package-lock.json,isolated_release.sh,modules.conf

