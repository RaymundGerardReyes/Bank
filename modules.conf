# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED MONOLITHIC RELEASE (Lockstep Versioning)
# Recommended for SOLO DEVELOPERS for maximum ease of tracking. 
# A single version tag represents the entire state of the full-stack repo.
# ------------------------------------------------------------------------------

backend|backend|feat|implement account settings update and resolve transaction history response mapping|backend/src
web-app|web-app|fix|align transaction models with backend DTOs and resolve TypeScript build errors|web-app/src,web-app/tests,web-app/package.json,web-app/package-lock.json,web-app/vitest.config.ts
infra|infra|chore|update docker compose configuration|infra/docker/compose.yaml
docs|docs|docs|update repository structure documentation|structure.md
tooling|tooling|chore|update release script logic and module configurations|isolated_release.sh,modules.conf
# ------------------------------------------------------------------------------
# APPROACH 1: INDEPENDENT COMPONENT RELEASES (Microservices style)
# If you eventually scale up to a team and need to deploy components separately,
# comment out Approach 2 above and uncomment the lines below.
# ------------------------------------------------------------------------------

# backend|backend|feat|implement mobile push authorization, passkey support, and auth metadata for transactions|backend/src
# web-app|web-app|refactor!|consolidate API proxy infrastructure, clean up environment configs, and update routing|web-app
# infra|infra|chore|update development docker compose configuration for proxy unification|infra
# tooling|tooling|docs|update port registry, architecture review, and gateway hardening documentation|PORT_REGISTRY.md,api-gateway-hardening-prompt.md,architecture_review.md
# mobile|expo|feat|add push authorization modal and pending authorizations hooks|ExpoBankingApp

