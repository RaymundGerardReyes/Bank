# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...|optional_commit_body
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED COMPONENT RELEASE
# Each component is isolated by scope and tagged with its semver release.
# ------------------------------------------------------------------------------

backend|backend|feat|integrate QR Ph checkout flow, add FX rate conversion, and execute Flyway schema migrations|backend|Integrate QR Ph (QR_PH) payment method into checkout session domain, payment method service, confirmation service, and internal payment execution service with strict double-entry ledger parity (CLEARING-QRPH-INCOMING debit and MERCHANT-SETTLEMENT credit), expose safe dynamic QR parameters in PublicCheckoutSessionResponse, add FxController and FakeFxRateProviderAdapter for real-time exchange rates, add Flyway V67 for settlement account permissions and V68 for nullable payment intent customer account numbers, and add comprehensive unit and path tests (CheckoutPaymentMethodServiceTest, CheckoutQrPaymentPathIT, AccountLockdownOutboundRejectionIT).
web-app|web-app|feat|add QR Ph payment option, dynamic QR presentation view, and FX conversion services|web-app|Add QR Ph (QR_PH) payment method to PaymentMethodSelector, build QrPhCheckoutView featuring dynamic EMVCo QR display, 15-minute countdown timer, copyable QR reference, and sandbox payment simulation, integrate QrPhCheckoutView into CheckoutOrchestrator flow, add foreign exchange conversion client services, and implement 100% passing unit and integration tests (PaymentMethodSelector.test.tsx, QrPhCheckoutView.test.tsx, CheckoutQrPhFlow.test.tsx).
mobile|mobile|feat|integrate foreign exchange conversion services and update account balances display|ExpoBankingApp|Add foreign exchange conversion rate services and integrate multi-currency balance liquidity formatting across dashboard and account list screens.
tests|tests|test|add OpenAPI endpoint verification suite and expand Postman test collections|tests|Add verify-all-openapi-endpoints.js covering 30/30 live API gateway endpoints, add run-all-collections.js and run-all-suites.js zero-dependency runners, and update Postman test collections for FX rates and dynamic QR scan lifecycle.
tooling|tooling|chore|update release script configurations and module release definitions|isolated_release.sh,modules.conf,scripts,.gitignore,.dockerignore|Update modules.conf release configuration with QR Ph payment integration, FX conversion services, and OpenAPI verification suite scopes.
backend|backend|fix|resolve gateway checkout URL, fix clearing account FK constraint, and whitelist public sessions|backend|Resolve checkout base URL prioritizing PAYMENT_WEBHOOK_PUBLIC_URL and PAYMENT_WEBHOOK_HOST for payment gateway routing, set merchantId=null for CLEARING-QRPH-INCOMING accounts to resolve fk_accounts_merchant foreign key violation during payment capture, expose sessionId, paymentIntentId, checkoutUrl, url, and clientSecret in CheckoutSessionResponse for ERP compatibility, whitelist public payment session endpoints in SecurityConfig, and align GatewayAuditIntegrityIT account numbers with tenant boundaries.
infra|infra|chore|configure payment gateway checkout URL and platform domain routing|infra|Configure PLATFORM_DOMAIN environment variable and set PAYMENT_CHECKOUT_BASE_URL default to https://${PAYMENT_WEBHOOK_HOST} in docker compose configurations for consistent payment gateway redirection.
web-app|web-app|fix|render QR Ph on HTML5 canvas, embed vector logo, and resolve premature timer expiration|web-app|Integrate qrcode.react for native HTML5 canvas rendering with Error Correction Level H, embed official BSP QR Ph vector emblem with quiet-zone excavation padding, fix false premature timer expiration caused by UTC timezone parsing mismatch on Spring Boot LocalDateTime strings, add high-resolution PNG download functionality, and expand unit test suite to 100% pass rate.
tooling|tooling|chore|update release configuration for gateway bug fixes and QR canvas update|isolated_release.sh,modules.conf,scripts,.gitignore,.dockerignore|Update modules.conf release configurations with scopes for backend gateway domain and FK fixes, infra docker routing, and web-app QR Ph canvas implementation.

