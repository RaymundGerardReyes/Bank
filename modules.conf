# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED MONOLITHIC RELEASE (Lockstep Versioning)
# Recommended for SOLO DEVELOPERS for maximum ease of tracking. 
# A single version tag represents the entire state of the full-stack repo.
# ------------------------------------------------------------------------------

backend|backend|feat!|enforce financial execution integrity and replace external legacy gateways|backend
web-app|web-app|chore|update API proxy routing and environment configuration for internal gateway|web-app
infra|infra|chore|align nginx and docker compose with zero-trust banking gateway topology|infra
tooling|tooling|chore|update port validation tooling and release automation scripts|scripts,package.json,package-lock.json,isolated_release.sh,modules.conf,modules.conf.example.txt
tests|tests|test|add test configuration and security matrix for idempotency and transaction integrity|tests
docs|docs|docs|update architecture, port registry, and documentation|*.md,.port-audit.json

# ------------------------------------------------------------------------------
# APPROACH 1: INDEPENDENT COMPONENT RELEASES (Microservices style)
# If you eventually scale up to a team and need to deploy components separately,
# comment out Approach 2 above and uncomment the lines below.
# ------------------------------------------------------------------------------

# backend|backend|feat|Update backend services|backend
# web-app|web-app|feat|Update web application|web-app
# mobile|expo|feat|Update mobile app|ExpoBankingApp
# infra|infra|chore|Update infrastructure configurations|infra
# tooling|tooling|chore|Update build scripts and root configs|package.json,package-lock.json,scripts,isolated_release.sh,scaffold.sh,scaffold-web.sh,scaffold-mobile.sh,.env,.env.keys
# docs|docs|docs|Update architecture and documentation|docs,*.md
