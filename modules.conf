# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...|optional_commit_body
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED COMPONENT RELEASE
# Each component is isolated by scope and tagged with its semver release.
# ------------------------------------------------------------------------------

backend|backend|refactor|harden security filters, fix Lombok AST compilation, and enforce IDOR and API key limits|backend|Resolve JDK 21 Lombok annotation processing conflicts, add Flyway V63 schema migration for API key limits, enforce zero-trust caller IDOR checks on accounts and statements, and implement bounded-memory OTP rate limiting.
web-app|web-app|refactor|update CSP policies, add health check bypass in middleware, and enhance auth flows|web-app|Scope auth middleware to bypass /api/health for Docker container orchestration, enforce strict CSP headers, and enhance developer onboarding and passkey auth flows.
infra|infra|chore|configure IPv4 health checks and container startup dependencies|infra|Add explicit IPv4 container health checks in compose.yaml to prevent Docker networking timeouts and ensure healthy startup ordering.
mobile|mobile|refactor|implement biometric and push transaction authorization screens|ExpoBankingApp|Add dual-control push authorization modals, biometric verification hooks, and hardened transaction workflows across deposit, withdraw, and transfer screens.
tooling|tooling|chore|restore isolated release script and update module release configurations|isolated_release.sh,modules.conf,.gitignore|Add index self-healing to isolated_release.sh, whitelist release tools in .gitignore, and align modules.conf with security refactoring scopes.

# ------------------------------------------------------------------------------
# APPROACH 1: INDEPENDENT COMPONENT RELEASES (Microservices style)
# If you deploy components separately, uncomment the lines below as needed.
# ------------------------------------------------------------------------------
# backend|backend|refactor|harden security filters, fix Lombok AST compilation, and enforce IDOR and API key limits|backend
# web-app|web-app|refactor|update CSP policies, add health check bypass in middleware, and enhance auth flows|web-app
# infra|infra|chore|configure IPv4 health checks and container startup dependencies|infra
# mobile|mobile|refactor|implement biometric and push transaction authorization screens|ExpoBankingApp
# tooling|tooling|chore|restore isolated release script and update module release configurations|isolated_release.sh,modules.conf,.gitignore
