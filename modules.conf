# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...|optional_commit_body
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED COMPONENT RELEASE
# Each component is isolated by scope and tagged with its semver release.
# ------------------------------------------------------------------------------

backend|backend|feat|orchestrate real-time live FX rate conversion and eliminate fake adapter from production sources|backend|Introduce LiveExchangeRateProviderAdapter connecting to live open currency APIs with TTL memory caching, excise FakeFxRateProviderAdapter entirely from production src/main/java and confine to src/test/java, configure live FX provider in application.yml, update live benchmark conversion for USD to PHP to 62.6280 resolving accurate multi-currency account computations ($122,074.00 USD -> ₱7,645,250.47 PHP), and add comprehensive unit and path tests (LiveExchangeRateProviderAdapterTest, FakeFxRateProviderAdapterTest, FxRatePathIT, FxCalculationServiceTest).
infra|infra|chore|configure live FX rate provider environment variables in Docker Compose|infra|Add FX_PROVIDER_TYPE and FX_PROVIDER_URL environment variables to the backend service definition in compose.yaml to enable live real-time currency conversion in production containers.
web-app|web-app|fix|update reference FX conversion benchmark to 62.6280 for real-time liquidity calculation|web-app|Update fallback FX reference rates to 62.6280 PHP for USD in fxService.ts, ensuring exact liquidity balance alignment across sub-accounts and core PHP ledger displays.
mobile|mobile|fix|align mobile FX reference rates with live 62.6280 PHP market benchmark|ExpoBankingApp|Update mobile app DEFAULT_RATES_TO_PHP with live market benchmark rate 62.6280 PHP for USD in fxService.ts.
tooling|tooling|chore|update module release configurations for live FX rate orchestration|isolated_release.sh,modules.conf,scripts,.gitignore,.dockerignore|Update modules.conf release configurations with entries for live FX rate provider, infra docker configuration, and frontend/mobile currency rate alignment.

