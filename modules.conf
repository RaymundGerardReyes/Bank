# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...|optional_commit_body
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED COMPONENT RELEASE
# Each component is isolated by scope and tagged with its semver release.
# ------------------------------------------------------------------------------

backend|backend|feat|implement asymmetric device-bound ECDSA biometric authentication, challenge replay guards, and eliminate production bypasses|backend|Implement cryptographic device authentication using ECDSA P-256 signatures over one-time server challenges; enforce challenge expiration, single-use nonce consumption, rate limiting, and account status checks; normalize DER and IEEE-P1363 signatures; excise synthetic verification fallbacks in production; add 17 integration security tests in DeviceBiometricAuthenticationIT.
web-app|web-app|feat|migrate to Next.js 16 edge proxy, resolve host backend DNS, and align OpenAPI docs|web-app|Migrate legacy middleware.ts to Next.js 16 src/proxy.ts supporting dual cookie/bearer session extraction, edge rate limiting, and developer route toggling; implement resolveBackendUrl in server env config to rewrite container URLs to loopback port 8086 on host runtimes; align OPENAPI_SPEC_URL default; add Vitest unit test suite validating environment URL resolution invariants.
mobile|mobile|feat|implement on-device cryptographic challenge signing, biometric key isolation, and design system hardening|ExpoBankingApp|Implement device-bound EC P-256 key generation and cryptographic challenge signing in deviceCryptoService; sanitize SecureStore keys to adhere to alphanumeric rules; isolate biometric credentials per authenticated user in FaceVerificationScreen and FaceEnrollmentScreen; fail closed on camera and network errors; harden PushAuthorizationModal, DeviceManagementScreen, StatementListScreen, and TransactionHistoryScreen with semantic design system tokens and Ionicons.
infra|infra|chore|configure Docker embedded DNS resolver in Nginx and expose backend port 8085 for mobile LAN|infra|Add resolver 127.0.0.11 valid=10s ipv6=off in infra/nginx/nginx.conf to dynamically refresh upstream container IPs and prevent 502 Bad Gateway errors; bind port 0.0.0.0:8085:8080 in compose.yaml and compose.dev.yaml to enable physical mobile devices on the developer Wi-Fi LAN to reach the Spring Boot backend.
tooling|tooling|chore|update release script stdin loop handling and release module configurations|isolated_release.sh,modules.conf,scripts,.gitignore,.dockerignore|Update modules.conf for device biometric security, Nginx DNS dynamic resolution, and mobile design system releases; optimize isolated_release.sh stdin loop handling.

