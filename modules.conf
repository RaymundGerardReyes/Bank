# ==============================================================================
# modules.conf - Release configuration for the Banking Monorepo
# Format: scope|tag_prefix|commit_type|commit_description|path1,path2,...|optional_commit_body
# ==============================================================================

# ------------------------------------------------------------------------------
# APPROACH 2: UNIFIED COMPONENT RELEASE
# Each component is isolated by scope and tagged with its semver release.
# ------------------------------------------------------------------------------

backend|backend|fix|resolve gateway checkout URL, fix clearing account FK constraint, and whitelist public sessions|backend|Resolve checkout base URL prioritizing PAYMENT_WEBHOOK_PUBLIC_URL and PAYMENT_WEBHOOK_HOST for payment gateway routing, set merchantId=null for CLEARING-QRPH-INCOMING accounts to resolve fk_accounts_merchant foreign key violation during payment capture, expose sessionId, paymentIntentId, checkoutUrl, url, and clientSecret in CheckoutSessionResponse for ERP compatibility, whitelist public payment session endpoints in SecurityConfig, and align GatewayAuditIntegrityIT account numbers with tenant boundaries.
infra|infra|chore|configure payment gateway checkout URL and platform domain routing|infra|Configure PLATFORM_DOMAIN environment variable and set PAYMENT_CHECKOUT_BASE_URL default to https://${PAYMENT_WEBHOOK_HOST} in docker compose configurations for consistent payment gateway redirection.
web-app|web-app|fix|render QR Ph on HTML5 canvas, embed vector logo, and resolve premature timer expiration|web-app|Integrate qrcode.react for native HTML5 canvas rendering with Error Correction Level H, embed official BSP QR Ph vector emblem with quiet-zone excavation padding, fix false premature timer expiration caused by UTC timezone parsing mismatch on Spring Boot LocalDateTime strings, add high-resolution PNG download functionality, and expand unit test suite to 100% pass rate.
tooling|tooling|chore|update release configuration for gateway bug fixes and QR canvas update|isolated_release.sh,modules.conf,scripts,.gitignore,.dockerignore|Update modules.conf release configurations with scopes for backend gateway domain and FK fixes, infra docker routing, and web-app QR Ph canvas implementation.

# ------------------------------------------------------------------------------
# APPROACH 1: INDEPENDENT COMPONENT RELEASES (Microservices style)
# If you deploy components separately, uncomment the lines below as needed.
# ------------------------------------------------------------------------------
