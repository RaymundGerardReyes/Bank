spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@company.com}
    password: ${MAIL_PASSWORD:}
    default-sender: ${MAIL_FROM:noreply@company.com}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${MAIL_HOST:smtp.gmail.com}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: hardened-banking-backend
  output:
    ansi:
      enabled: always
  main:
    allow-bean-definition-overriding: false

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

platform:
  domain: ${PLATFORM_DOMAIN:}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

security:
  bff:
    secret: ${INTERNAL_BFF_API_KEY:}

springdoc:
  override-with-generic-response: false
  api-docs:
    path: /v3/api-docs
