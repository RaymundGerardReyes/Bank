spring:
  datasource:
    url: 'jdbc:h2:mem:testdb_${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS "TEXT" AS VARCHAR\;CREATE DOMAIN IF NOT EXISTS "text" AS VARCHAR\;CREATE DOMAIN IF NOT EXISTS "JSONB" AS VARCHAR\;CREATE DOMAIN IF NOT EXISTS "jsonb" AS VARCHAR'
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  # Flyway safely disabled
  flyway:
    enabled: false

payment:
  provider: paymongo
  paymongo:
    secret-key: sk_test_mock_123456789
    webhook-secret: whsec_test_secret_123456789
    sandbox: true

logging:
  level:
    root: INFO
    com.company.banking: DEBUG
    org.springframework.test.context.cache: DEBUG

API_PUBLIC_URL: http://localhost:8080
PAYMENT_WEBHOOK_PUBLIC_URL: http://localhost:8080/api/v1/payments/webhook
PAYMENT_WEBHOOK_HOST: http://localhost:8080
PAYMENT_ALLOWED_DOMAINS: paymongo.com,developerph.dev,localhost

